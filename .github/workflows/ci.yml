# Goal: Build the image for Devboad, after linting the code
name: CI

on:
  push:
    branches: [master]

jobs:
  code-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # Specify your project's Node version
          cache: 'npm'     # Enables caching for faster dependency installs

    
      - name: Install dependencies
        run: npm ci

      - name: Install Linter
        run: npm install --save-dev
        
      - name: Run ESlint
        run: npm run lint
  
  build-and-push:
    needs: [code-lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Docker Setup [Login]
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Build and Push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/devboard-fe-master:latest
